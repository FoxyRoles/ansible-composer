---

- name: composer binary present
  ansible.builtin.get_url:
    url: https://getcomposer.org/composer.phar
    dest: "{{ composer_install_path }}"
    mode: 0755

- name: composer update cron present
  ansible.builtin.copy:
    src: composer.cron
    dest: "{{ composer_update_cron_path }}"
    mode: 0755
